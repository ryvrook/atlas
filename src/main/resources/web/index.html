<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>{{TITLE}}</title>
<script>
(function () {
  // Relative URLs need a trailing slash when the map is mounted under a sub path such as /map.
  var p = location.pathname;
  if (p.length > 1 && p.charAt(p.length - 1) !== "/" && p.slice(p.lastIndexOf("/") + 1).indexOf(".") < 0) {
    location.replace(p + "/" + location.search + location.hash);
  }
  var t = null;
  try { t = localStorage.getItem("atlas.theme"); } catch (e) { t = null; }
  if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link rel="stylesheet" href="style.css">
</head>

  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>

<header id="bar">
  <div class="brand">
    <img class="brand-mark" src="icon-64.png" alt="" aria-hidden="true" width="28" height="28" decoding="async">
    <h1 id="title"></h1>
  </div>
  <div class="world-wrap">
    <button id="world-btn" class="chip-btn" aria-haspopup="true" aria-expanded="false" aria-controls="world-menu" aria-label="Choose a world">
      <span id="world-label">World</span><svg class="ic sm" aria-hidden="true"><use href="#i-chevron"/></svg>
    </button>
    <div id="world-menu" class="popover" role="menu" hidden></div>
  </div>
  <div id="search-wrap" role="search">
    <svg class="ic sm search-ic" aria-hidden="true"><use href="#i-search"/></svg>
    <input id="search" type="search" placeholder="Player, place or x z" autocomplete="off" spellcheck="false"
      aria-label="Search the map" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" role="combobox">
    <kbd class="hint" aria-hidden="true">/</kbd>
    <div id="search-results" class="popover" role="listbox" hidden></div>
  </div>
  <span class="spacer"></span>
  <span id="status" class="status" role="status" aria-live="polite"><span class="dot"></span><span class="txt">Connecting</span></span>
  <span id="online" class="online" hidden></span>
  <button id="search-toggle" class="icon-btn only-narrow" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
  <div class="account-wrap">
    <button id="account-btn" class="chip-btn" aria-haspopup="true" aria-expanded="false"><svg class="ic sm" aria-hidden="true"><use href="#i-link"/></svg><span id="account-label">Link</span></button>
    <div id="account-menu" class="popover right" hidden></div>
  </div>
  <button id="theme-btn" class="icon-btn" aria-label="Switch theme"><svg class="ic"><use href="#i-moon"/></svg></button>
  <button id="panel-btn" class="icon-btn" aria-label="Show or hide the side panel" aria-controls="panel" aria-expanded="true"><svg class="ic"><use href="#i-panel"/></svg></button>
</header>

<main id="stage">
  <div id="map" aria-label="Map" tabindex="0"></div>
  <div id="crosshair" aria-hidden="true"><svg class="ic"><use href="#i-cross"/></svg></div>
  <div id="banners"><div id="update-bar" class="banner update" role="status" hidden></div><div id="event-banners" aria-live="polite"></div></div>
  <div id="controls" class="ctl-stack">
    <div class="ctl-group">
      <button class="icon-btn" id="zoom-in" aria-label="Zoom in" title="Zoom in"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button class="icon-btn" id="zoom-out" aria-label="Zoom out" title="Zoom out"><svg class="ic"><use href="#i-minus"/></svg></button>
    </div>
    <div class="ctl-group">
      <button class="icon-btn" id="layers-btn" aria-label="Layers and filters" title="Layers and filters" aria-expanded="false" aria-controls="layers-pop"><svg class="ic"><use href="#i-layers"/></svg></button>
      <button class="icon-btn" id="findme-btn" aria-label="Find me" title="Find me (f)"><svg class="ic"><use href="#i-locate"/></svg></button>
      <button class="icon-btn" id="measure-btn" aria-label="Measure distance" title="Measure distance" aria-pressed="false"><svg class="ic"><use href="#i-ruler"/></svg></button>
      <button class="icon-btn" id="share-btn" aria-label="Copy a link to this view" title="Copy a link to this view"><svg class="ic"><use href="#i-share"/></svg></button>
      <button class="icon-btn" id="timeline-btn" aria-label="Timeline" title="Timeline" aria-pressed="false" aria-controls="tl-bar" hidden><svg class="ic"><use href="#i-history"/></svg></button>
    </div>
    <div id="layers-pop" class="popover layers-pop" hidden></div>
  </div>
  <div id="hud">
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="hint" class="hint-card" role="note" hidden></div>
    <div id="tl-chip" class="hud-chip tl-chip" role="status" hidden></div>
    <div id="follow-chip" class="hud-chip" hidden></div>
    <div id="measure-chip" class="hud-chip" hidden></div>
    <div id="coords" class="hud-chip mono" aria-live="off"></div>
  </div>
  <div id="ctxmenu" class="popover ctx" role="dialog" aria-label="Location" hidden></div>
</main>

<div id="tl-bar" class="tl-bar" role="region" aria-label="Timeline" hidden>
  <button class="icon-btn" id="tl-play" aria-label="Play the timeline" title="Play (space)"><svg class="ic"><use href="#i-play"/></svg></button>
  <div class="tl-track">
    <canvas id="tl-strip" aria-hidden="true"></canvas>
    <input type="range" id="tl-range" min="0" max="0" step="1" value="0" aria-label="Day on the timeline">
    <div class="tl-ends" aria-hidden="true"><span id="tl-first"></span><span>Live</span></div>
  </div>
  <div class="tl-side">
    <span id="tl-label" class="tl-label">Live</span>
    <select id="tl-speed" aria-label="Playback speed" title="Playback speed">
      <option value="500">0.5 s a day</option><option value="1000">1 s a day</option><option value="2000">2 s a day</option>
    </select>
    <button class="icon-btn" id="tl-changed" aria-label="Tint the tiles that changed that day" title="Tint the tiles that changed that day" aria-pressed="false"><svg class="ic"><use href="#i-diamond"/></svg></button>
    <button class="icon-btn" id="tl-close" aria-label="Close the timeline" title="Close the timeline"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
</div>

<aside id="panel" aria-label="Side panel">
  <div class="sheet-handle" id="sheet-handle">
    <span class="grip" aria-hidden="true"></span>
    <button id="sheet-peek" class="sheet-peek" aria-controls="panel" aria-expanded="false"><svg class="ic sm" aria-hidden="true"><use id="peek-icon" href="#i-panel"/></svg><span id="peek-label">Panel</span><svg class="ic sm peek-chev" aria-hidden="true"><use href="#i-chevron"/></svg></button>
  </div>
  <nav id="tabs" role="tablist" aria-label="Panel sections"></nav>
  <section id="tab-body" role="tabpanel" tabindex="-1"></section>
</aside>

<dialog id="link-dialog" aria-labelledby="link-title">
  <form method="dialog" id="link-form">
    <h2 id="link-title">Link this browser</h2>
    <p class="muted">Type /atlas link in game. Enter the six character code it shows you here.</p>
    <input id="link-code" maxlength="6" autocomplete="one-time-code" aria-label="Link code" spellcheck="false">
    <div id="link-error" role="alert"></div>
    <div class="dialog-actions">
      <button type="button" id="link-cancel" class="btn">Cancel</button>
      <button type="submit" class="btn primary">Link</button>
    </div>
  </form>
</dialog>

<noscript><p class="noscript">This map needs JavaScript.</p></noscript>
<script src="vendor/leaflet.js"></script>
<script src="core.js"></script>
<script src="map.js"></script>
<script src="panel.js"></script>
<script src="timeline.js"></script>
<script src="app.js"></script>
</body>
</html>
