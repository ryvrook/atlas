name: Bug report
description: Something in Atlas does not work the way the README says it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Fill in what you can. A server log excerpt and your config make most bugs quick to fix.
  - type: input
    id: version
    attributes:
      label: Atlas version
      description: Run `/atlas` in game to see the version, or open the Stats tab on the map.
      placeholder: "0.2.2"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Hytale server version
      description: The version printed at the top of the server log.
      placeholder: "0.7.0"
    validations:
      required: true
  - type: input
    id: mods
    attributes:
      label: Other mods installed
      description: Every other jar in the mods folder, with versions when you know them.
      placeholder: BetterMap 1.3.9, Feats 1.1.0
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Browser name and version, and whether it was a phone or a desktop, when the problem is on the web map.
      placeholder: Chrome 130 on Windows, or Safari on iPhone
    validations:
      required: false
  - type: input
    id: proxy
    attributes:
      label: Reverse proxy
      description: Say if the map sits behind a reverse proxy and which one, when the problem is about links, sessions or addresses.
      placeholder: Caddy, with trustedProxies set to 127.0.0.1
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server with ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Server log
      description: The lines around the problem from the server log. Any stack trace is especially useful. This will be formatted as code.
      render: text
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: Config
      description: The mod config file, with any secrets such as tokens removed. This will be formatted as code.
      render: json
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I searched the open issues and did not find this one.
          required: true
        - label: I am on the latest release of Atlas.
          required: false
